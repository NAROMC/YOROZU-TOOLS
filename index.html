<script>
const icons={timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6M12 2v3M19 6l1.5-1.5"/>',stopwatch:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6M12 2v3"/>',calculator:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"/>',percent:'<path d="M19 5 5 19M7.5 8.5h.01M16.5 15.5h.01"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',wand:'<path d="m15 4 5 5M4 20 16 8M6 4v4M4 6h4M18 14v4M16 16h4"/>',compress:'<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M8 8l4 4 4-4m-4 4V3m0 18v-5m0 0 4 4m-4-4-4 4"/>',text:'<path d="M4 6V4h16v2M12 4v16m-4 0h8"/>',count:'<path d="M4 7h16M4 12h10M4 17h16"/><path d="M18 10v8m-2-2 2 2 2-2"/>',roulette:'<circle cx="12" cy="12" r="9"/><path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2L12 3Z"/>',lottery:'<path d="M4 5h16v14H4zM8 9h8M8 13h3M8 16h5"/><path d="m16 14 1 1 2-3"/>'};
const tools=[{id:'timer',name:'カウントダウン',category:'time',label:'TIME',description:'時間をセットして集中。終了を音でお知らせ。',tone:'green',icon:'timer',active:true},{id:'stopwatch',name:'カウントアップ',category:'time',label:'TIME',description:'経過時間を計測。ラップタイムにも対応。',tone:'blue',icon:'stopwatch',active:true},{id:'calculator',name:'計算機',category:'calc',label:'MATH',description:'日常の計算に使いやすい、シンプルな電卓。',tone:'orange',icon:'calculator',active:true},{id:'percent',name:'割引計算',category:'calc',label:'MATH',description:'割引後の価格や、割引額をかんたん計算。',tone:'yellow',icon:'percent',active:true},{id:'image',name:'画像を調整',category:'image',label:'IMAGE',description:'明るさや色味を整えて、そのまま保存。',tone:'purple',icon:'image',active:true},{id:'background',name:'背景切り抜き',category:'image',label:'IMAGE',description:'画像の背景色を選んで透明にします。',tone:'green',icon:'wand',active:true},{id:'compress',name:'画像の容量削減',category:'image',label:'IMAGE',description:'画質と形式を調整してファイルを軽く。',tone:'blue',icon:'compress',active:true},{id:'chars',name:'文字数カウント',category:'text',label:'TEXT',description:'文字数、行数、空白を除いた文字数を集計。',tone:'purple',icon:'count',active:true},{id:'roulette',name:'ルーレット',category:'random',label:'RANDOM',description:'選択肢を入れて、ルーレットでひとつ決定。',tone:'yellow',icon:'roulette',active:true},{id:'lottery',name:'くじ',category:'random',label:'RANDOM',description:'名前や候補から、重複なしで抽選。',tone:'pink',icon:'lottery',active:true}];
const $=s=>document.querySelector(s);const grid=$('#grid');let category='all',query='';function iconSVG(key){return `<svg viewBox="0 0 24 24">${icons[key]}</svg>`}function renderCards(){const shown=tools.filter(t=>(category==='all'||t.category===category)&&(`${t.name} ${t.description} ${t.label}`.toLowerCase().includes(query.toLowerCase())));$('#shown-count').textContent=String(shown.length).padStart(2,'0')+' ITEMS';grid.innerHTML=shown.map(t=>`<button class="tool-card" data-open="${t.id}"><div class="card-top"><span class="tool-icon tone-${t.tone}">${iconSVG(t.icon)}</span><span class="tag">${t.label}</span></div><div class="card-title">${t.name}</div><div class="card-desc">${t.description}</div><span class="card-arrow">↗</span></button>`).join('')||'<div class="empty">見つかりませんでした。別のキーワードをお試しください。</div>';grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTool(b.dataset.open))}renderCards();
$('#filters').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderCards()};$('#search').oninput=e=>{query=e.target.value;renderCards()};window.onhashchange=()=>{let id=location.hash.slice(1);if(id&&tools.some(t=>t.id===id)){if(id!==activeToolId)openTool(id,false)}else showHome()};
let activeToolId=null;function closeActiveTool(){if(activeToolId==='timer'){clearInterval(timerInterval);timerInterval=null}if(activeToolId==='stopwatch'){clearInterval(stopwatchInterval);stopwatchInterval=null}if(activeToolId==='lottery'&&lotteryAnimation){lotteryAnimation.cancel();lotteryAnimation=null}if(activeToolId==='roulette')rouletteBusy=false;if(activeToolId==='compress'){compressPreviewSeq++;if(compressPreviewURL){URL.revokeObjectURL(compressPreviewURL);compressPreviewURL=null}}activeToolId=null}function openTool(id,setHash=true){const t=tools.find(x=>x.id===id);if(!t)return;if(!t.active){toast('このツールは準備中です。');return}if(activeToolId)closeActiveTool();activeToolId=id;$('#home').classList.add('hidden');$('#tool-page').classList.remove('hidden');$('#tool-heading').innerHTML=`<span class="tool-icon tone-${t.tone}">${iconSVG(t.icon)}</span><div><h1>${t.name}</h1><p>${t.description}</p></div>`;$('#tool-body').innerHTML=toolHTML(id);if(setHash)location.hash=id;if(id==='timer')initTimer();if(id==='stopwatch')initStopwatch();if(id==='calculator')initCalculator();if(id==='percent')initPercent();if(id==='image')initImage();if(id==='background')initBackground();if(id==='compress')initCompress();if(id==='chars')initChars();if(id==='roulette')initRoulette();if(id==='lottery')initLottery()}function showHome(){if(activeToolId)closeActiveTool();if(!$('#tool-page').classList.contains('hidden')){$('#tool-page').classList.add('hidden');$('#home').classList.remove('hidden')}}$('#back').onclick=()=>{history.pushState(null,'',location.pathname+location.search);showHome()};
function toolHTML(id){if(id==='timer')return timerHTML();if(id==='stopwatch')return stopwatchHTML();if(id==='calculator')return calcHTML();if(id==='percent')return percentHTML();if(id==='image')return imageHTML();if(id==='background')return backgroundHTML();if(id==='compress')return compressHTML();if(id==='chars')return charsHTML();if(id==='roulette')return rouletteHTML();if(id==='lottery')return lotteryHTML();return ''}
function timerHTML(){return `<div class="panel"><div class="timer-display"><div class="timer-number" id="timer-display">05:00</div><div class="timer-state" id="timer-state">時間をセットしてスタート</div></div><div class="timer-progress"><span id="timer-progress"></span></div><div class="time-inputs"><label>分<input id="timer-min" type="number" min="0" max="99" value="5"></label><span class="time-colon">:</span><label>秒<input id="timer-sec" type="number" min="0" max="59" value="0"></label></div><div class="presets"><button class="preset" data-min="1">1分</button><button class="preset" data-min="5">5分</button><button class="preset" data-min="10">10分</button><button class="preset" data-min="25">25分</button></div><div class="actions"><button class="btn btn-primary" id="timer-toggle">スタート</button><button class="btn" id="timer-reset">リセット</button></div><div class="note">時間になると音でお知らせします</div></div>`}

ランチC</textarea><div class="wheel-settings"><label>回転時間 <input type="range" id="wheel-duration" min="2" max="10" value="5"> <span id="wheel-duration-label">5秒</span></label><label><input type="checkbox" id="wheel-sound" checked> 効果音</label></div><div class="actions"><button class="btn btn-primary" id="roulette-go">ルーレットを回す</button></div></div>`}let rouletteBusy=false;function initRoulette(){rouletteBusy=false;$('#roulette-result').textContent='候補を入力してください';$('#roulette-sub').textContent='候補を円盤にして回します';$('#wheel-duration').oninput=()=>$('#wheel-duration-label').textContent=$('#wheel-duration').value+'秒';$('#roulette-input').oninput=drawWheel;drawWheel();$('#roulette-go').onclick=()=>{const list=$('#roulette-input').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!list.length){toast('候補を1つ以上入力してください');return}if(rouletteBusy)return;drawWheel();const n=list.length,index=Math.floor(Math.random()*n),slice=360/n,target=360*5+(360-((index+.5)*slice)%360),duration=Number($('#wheel-duration').value);rouletteBusy=true;const btn=$('#roulette-go'),wheel=$('#wheel-canvas');btn.disabled=true;wheel.style.transition='none';wheel.style.transform='rotate(0deg)';void wheel.offsetWidth;wheel.style.transition=`transform ${duration}s cubic-bezier(.12,.68,.12,1)`;let audio=null,lastSector=-1,raf=0;const sound=$('#wheel-sound').checked;if(sound){try{audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}const started=performance.now();wheel.style.transform=`rotate(${target}deg)`;function tick(now){if(activeToolId!=='roulette'){cancelAnimationFrame(raf);rouletteBusy=false;if(audio)audio.close();return}const p=Math.min(1,(now-started)/(duration*1000)),ease=1-Math.pow(1-p,4),rotation=target*ease,sector=((270-(rotation%360)+360)%360)/360*n,nowSector=Math.floor(sector)%n;if(sound&&audio&&nowSector!==lastSector){lastSector=nowSector;const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=520;gain.gain.setValueAtTime(.0001,audio.currentTim n lotteryHTML(){return '<div class="panel"><p class="lottery-status" id="lottery-status">候補を入力して「くじを引く」を押してください</p><div class="lottery-reel-window"><div class="lottery-reel-track" id="lottery-reel-track"></div></div><textarea class="data-textarea" id="lottery-input" style="min-height:130px;margin-top:16px" placeholder="候補を1行ずつ入力（例：候補A&#10;候補B&#10;候補C）"></textarea><div class="lottery-time-setting"><label for="lottery-duration">演出時間 <span id="lottery-duration-label">4秒</span></label><input class="slider" type="range" id="lottery-duration" min="2" max="10" step="1" value="4"></div><div class="actions"><button class="btn btn-primary" id="lottery-go">くじを引く</button><button class="btn" id="lottery-reset">最初から</button></div></div>'}
let lotteryPool=[],lotteryStarted=false,lotteryAnimation=null,lotteryCenter=0;
